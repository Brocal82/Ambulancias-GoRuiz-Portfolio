name: Security Isolation Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  security-isolation:
    name: security-isolation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tenant isolation security gate
        run: npm run test:security:isolation:ci
